name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module_version=$(python -c 'import runpy; print(runpy.run_path("astrocolibri/_version.py")["__version__"])')
          citation_version=$(sed -nE 's/^version:[[:space:]]*"([^"]+)".*/\1/p' CITATION.cff | head -1)
          expected_tag="v${package_version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag '$RELEASE_TAG' must match package version '$expected_tag'." >&2
            exit 1
          fi

          if [[ "$module_version" != "$package_version" ]]; then
            echo "astrocolibri/_version.py ($module_version) does not match pyproject.toml ($package_version)." >&2
            exit 1
          fi

          if [[ "$citation_version" != "$package_version" ]]; then
            echo "CITATION.cff ($citation_version) does not match pyproject.toml ($package_version)." >&2
            exit 1
          fi

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Store distributions for publication
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astro-colibri/
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
