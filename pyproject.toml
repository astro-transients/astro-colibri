[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-colibri"
version = "1.0.0"
description = "Python SDK for Astro-COLIBRI alerts and services"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "Astro-Colibri Team", email = "astro.colibri@gmail.com" }]
requires-python = ">=3.9"

dependencies = ["confluent-kafka>=2.3.0"]

keywords = ["astronomy", "alerts", "kafka", "broker", "voevent", "transients"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.4", "pytest-cov>=4.1", "requests>=2.31", "twine>=5"]

[project.urls]
Homepage = "https://astro-colibri.com"
Documentation = "https://astro-colibri.science/brokerdoc"
Repository = "https://github.com/astro-transients/astro-colibri"
"Bug Tracker" = "https://github.com/astro-transients/astro-colibri/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["astrocolibri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: hits the real production broker and API; needs credentials, skipped without them",
]

[tool.coverage.run]
source = ["astrocolibri"]
omit = ["tests/*"]
