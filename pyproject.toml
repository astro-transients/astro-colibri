[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-colibri"
version = "0.1.0"
description = "Python SDK for Astro-COLIBRI alerts and services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Astro-Colibri Team", email = "contact@astrocolibri.org" }]
requires-python = ">=3.9"

dependencies = ["confluent-kafka>=2.3.0"]

keywords = ["astronomy", "alerts", "kafka", "broker", "voevent", "transients"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.4", "pytest-cov>=4.1", "twine>=5"]

[project.urls]
Homepage = "https://astro-colibri.com"
Documentation = "https://astro-colibri.science"
Repository = "https://github.com/astro-transients/astro-colibri"
"Bug Tracker" = "https://github.com/astro-transients/astro-colibri/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["astrocolibri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["astrocolibri"]
omit = ["tests/*"]
